name: Lab 9 - Mobile Price Failure and Recovery Tests

on:
  workflow_dispatch:

jobs:
  failure-tests:
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Build and register the normal model first
        run: python pipelines/run_lab8_pipeline.py
      - name: Run Lab 9 failure injection and recovery tests
        run: python src/mlops_pipeline/10_failure_injection.py
      - name: Upload Lab 9 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-price-lab9-${{ github.run_number }}
          path: |
            reports/**
            artifacts/**
            logs/**
          if-no-files-found: ignore
