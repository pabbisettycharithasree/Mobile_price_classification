name: Lab 8 - Mobile Price MLOps CI

on:
  push:
    branches: [main, master]
    paths:
      - "config_lab7.yaml"
      - "src/mlops_pipeline/**"
      - "pipelines/**"
      - "requirements.txt"
      - "data/raw/train.csv"
      - "data/raw/test.csv"
      - ".github/workflows/lab8_ci.yml"
  pull_request:
    paths:
      - "config_lab7.yaml"
      - "src/mlops_pipeline/**"
      - "pipelines/**"
      - "requirements.txt"
      - "data/raw/train.csv"
      - "data/raw/test.csv"
      - ".github/workflows/lab8_ci.yml"
  workflow_dispatch:

jobs:
  mobile-price-mlops-ci:
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run Lab 8 pipeline with quality gate
        run: python pipelines/run_lab8_pipeline.py
      - name: Upload Lab 8 reports and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-price-lab8-${{ github.run_number }}
          path: |
            artifacts/**
            reports/**
            logs/**
            outputs/**
          if-no-files-found: ignore
