name: Mobile Price monitoring workflow
on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'
jobs:
  monitoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements-api.txt
      - run: python src/mlops_pipeline/12_create_evolved_dataset.py
      - run: python src/mlops_pipeline/12_data_drift.py
      - run: python src/mlops_pipeline/12_monitor_trigger.py
